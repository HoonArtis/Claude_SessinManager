<meta charset="utf-8">
<title>Claude 세션 매니저</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --border: #e2e5ea; --text: #1c2128; --muted: #6b7280; --accent: #c96442; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; }
  #search { flex: 1; max-width: 480px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
  header label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  main { flex: 1; display: flex; min-height: 0; }
  #list { flex: 1; overflow-y: auto; padding: 12px; }
  .row { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; cursor: pointer; }
  .row:hover { border-color: var(--accent); }
  .row.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .row .title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .row .meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  #detail { width: 40%; min-width: 320px; max-width: 560px; background: var(--panel); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; display: none; }
  #detail.open { display: block; }
  #detail h2 { font-size: 15px; margin: 0 0 12px; }
  #detail dl { font-size: 13px; }
  #detail dt { color: var(--muted); margin-top: 10px; }
  #detail dd { margin: 2px 0 0; word-break: break-all; white-space: pre-wrap; }
  .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .btn-row button { flex: 1; padding: 10px; border: 0; border-radius: 8px; font-size: 14px; cursor: pointer; }
  #resumeBtn { background: var(--accent); color: #fff; }
  #openBtn { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-row button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 18px; }
  #empty-msg { color: var(--muted); text-align: center; margin-top: 40px; }
  #kbBtn { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); font-size: 13px; cursor: pointer; }
  #kbBtn:hover { border-color: var(--accent); }
  #kbOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; }
  #kbOverlay.open { display: flex; align-items: center; justify-content: center; }
  #kbModal { background: var(--panel); border-radius: 12px; padding: 24px; width: 520px; max-height: 80vh; overflow-y: auto; }
  #kbModal h2 { font-size: 15px; margin: 0 0 4px; }
  #kbModal .hint { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .kb-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .kb-row .kb-label { flex: 1; }
  .kb-key { min-width: 150px; text-align: center; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font-family: Consolas, monospace; font-size: 12px; cursor: pointer; }
  .kb-key.listening { border-color: var(--accent); color: var(--accent); }
  .kb-key.changed { border-color: var(--accent); }
  #kbStatus { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 18px; }
  #kbClose { margin-top: 12px; width: 100%; padding: 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); cursor: pointer; }
</style>
<header>
  <h1>Claude 세션 매니저</h1>
  <input id="search" type="search" placeholder="제목·프롬프트 검색...">
  <label><input id="showEmpty" type="checkbox"> 빈 세션 표시</label>
  <button id="kbBtn">⌨ 터미널 단축키</button>
</header>
<main>
  <div id="list"></div>
  <aside id="detail"></aside>
</main>
<div id="kbOverlay">
  <div id="kbModal">
    <h2>Windows Terminal 단축키</h2>
    <div class="hint">키 칸을 클릭한 뒤 원하는 키 조합을 누르면 settings.json에 바로 저장됩니다. (저장 전 자동 백업: settings.json.csm-backup)</div>
    <div id="kbList"></div>
    <div id="kbStatus"></div>
    <button id="kbClose">닫기</button>
  </div>
</div>
<script>
'use strict';
let sessions = [];
let selected = null;
const $list = document.getElementById('list');
const $detail = document.getElementById('detail');
const $search = document.getElementById('search');
const $showEmpty = document.getElementById('showEmpty');

function relTime(iso) {
  if (!iso) return '-';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return '방금 전';
  if (m < 60) return m + '분 전';
  const h = Math.floor(m / 60);
  if (h < 24) return h + '시간 전';
  const d = Math.floor(h / 24);
  if (d < 30) return d + '일 전';
  return new Date(iso).toLocaleDateString('ko-KR');
}

function esc(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
}

function visible() {
  const q = $search.value.trim().toLowerCase();
  return sessions.filter((s) => {
    if (s.empty && !$showEmpty.checked) return false;
    if (!q) return true;
    return [s.title, s.firstPrompt, s.lastPrompt, s.cwd]
      .some((f) => f && f.toLowerCase().includes(q));
  });
}

function renderList() {
  const items = visible();
  if (!items.length) {
    $list.innerHTML = '<p id="empty-msg">표시할 세션이 없습니다.</p>';
    return;
  }
  $list.innerHTML = items.map((s) => `
    <div class="row${selected === s.sessionId ? ' active' : ''}" data-id="${esc(s.sessionId)}">
      <div class="title">${esc(s.title || '(제목 없음)')}</div>
      <div class="meta">
        <span>📁 ${esc(s.cwd || '(경로 없음)')}</span>
        <span>🕒 ${relTime(s.lastTimestamp)}</span>
        <span>💬 ${s.messageCount}</span>
      </div>
    </div>`).join('');
}

function renderDetail() {
  const s = sessions.find((x) => x.sessionId === selected);
  if (!s) { $detail.classList.remove('open'); return; }
  const durMs = s.firstTimestamp && s.lastTimestamp ? new Date(s.lastTimestamp) - new Date(s.firstTimestamp) : 0;
  const durMin = Math.round(durMs / 60000);
  $detail.classList.add('open');
  $detail.innerHTML = `
    <h2>${esc(s.title || '(제목 없음)')}</h2>
    <dl>
      <dt>작업 폴더</dt><dd>${esc(s.cwd || '-')}</dd>
      <dt>마지막 활동</dt><dd>${relTime(s.lastTimestamp)} (${esc(s.lastTimestamp || '-')})</dd>
      <dt>작업 시간</dt><dd>약 ${durMin}분 · 메시지 ${s.messageCount}개</dd>
      <dt>git 브랜치</dt><dd>${esc(s.gitBranch || '-')}</dd>
      <dt>첫 프롬프트</dt><dd>${esc((s.firstPrompt || '-').slice(0, 1000))}</dd>
      <dt>마지막 프롬프트</dt><dd>${esc((s.lastPrompt || '-').slice(0, 1000))}</dd>
      <dt>세션 ID</dt><dd>${esc(s.sessionId)}</dd>
    </dl>
    <div class="btn-row">
      <button id="resumeBtn"${s.cwd ? '' : ' disabled'}>▶ 이어서 작업</button>
      <button id="openBtn"${s.cwd ? '' : ' disabled'}>📂 폴더 열기</button>
    </div>
    <div id="status"></div>`;
  document.getElementById('resumeBtn').onclick = () => callApi('/api/resume', s, '터미널을 열었습니다.');
  document.getElementById('openBtn').onclick = () => callApi('/api/open-folder', s, '탐색기를 열었습니다.');
}

async function callApi(url, s, okMsg) {
  const $status = document.getElementById('status');
  $status.textContent = '실행 중...';
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: s.sessionId, cwd: s.cwd }),
    });
    const body = await res.json();
    $status.textContent = res.ok ? okMsg : '실패: ' + body.error;
  } catch (err) {
    $status.textContent = '실패: ' + err.message;
  }
}

async function load() {
  const res = await fetch('/api/sessions');
  sessions = await res.json();
  renderList();
  renderDetail();
}

$list.addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (!row) return;
  selected = row.dataset.id;
  renderList();
  renderDetail();
});
$search.addEventListener('input', renderList);
$showEmpty.addEventListener('change', renderList);

// ---- Windows Terminal 단축키 편집 ----
const $kbOverlay = document.getElementById('kbOverlay');
const $kbList = document.getElementById('kbList');
const $kbStatus = document.getElementById('kbStatus');
let shortcuts = [];
let listeningId = null;

function renderShortcuts() {
  $kbList.innerHTML = shortcuts.map((s) => `
    <div class="kb-row">
      <span class="kb-label">${esc(s.label)}</span>
      <span class="kb-key${listeningId === s.id ? ' listening' : ''}${s.currentKeys !== s.defaultKeys ? ' changed' : ''}" data-id="${esc(s.id)}">
        ${listeningId === s.id ? '키를 누르세요...' : esc(s.currentKeys)}
      </span>
    </div>`).join('');
}

async function loadShortcuts() {
  const res = await fetch('/api/wt-keybindings');
  const body = await res.json();
  if (!body.available) {
    $kbList.innerHTML = '<p>Windows Terminal settings.json을 찾을 수 없습니다.</p>';
    return;
  }
  shortcuts = body.shortcuts;
  renderShortcuts();
}

// 브라우저 KeyboardEvent를 WT 키 표기로 변환
function eventToWtKeys(e) {
  const mods = [];
  if (e.ctrlKey) mods.push('ctrl');
  if (e.altKey) mods.push('alt');
  if (e.shiftKey) mods.push('shift');
  if (e.metaKey) mods.push('win');
  const map = { arrowleft: 'left', arrowright: 'right', arrowup: 'up', arrowdown: 'down', '-': 'minus', '=': 'plus', '_': 'minus', '+': 'plus', ' ': 'space' };
  let key = e.key.toLowerCase();
  if (['control', 'alt', 'shift', 'meta'].includes(key)) return null; // 수정키만 누른 상태
  key = map[key] || key;
  if (!mods.length) return null; // 수정키 없는 단일 키는 오입력 방지를 위해 무시
  return mods.concat(key).join('+');
}

async function saveShortcut(id, keys) {
  $kbStatus.textContent = '저장 중...';
  try {
    const res = await fetch('/api/wt-keybindings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, keys }),
    });
    const body = await res.json();
    if (!res.ok) { $kbStatus.textContent = '실패: ' + body.error; return; }
    shortcuts = body.shortcuts;
    $kbStatus.textContent = '저장했습니다 — 터미널에 바로 적용됩니다.';
  } catch (err) {
    $kbStatus.textContent = '실패: ' + err.message;
  }
  renderShortcuts();
}

$kbList.addEventListener('click', (e) => {
  const el = e.target.closest('.kb-key');
  if (!el) return;
  listeningId = listeningId === el.dataset.id ? null : el.dataset.id;
  $kbStatus.textContent = listeningId ? '원하는 키 조합을 누르세요 (수정키 + 키). ESC로 취소.' : '';
  renderShortcuts();
});

document.addEventListener('keydown', (e) => {
  if (!listeningId) return;
  e.preventDefault();
  if (e.key === 'Escape') { listeningId = null; $kbStatus.textContent = ''; renderShortcuts(); return; }
  const keys = eventToWtKeys(e);
  if (!keys) return;
  const id = listeningId;
  listeningId = null;
  saveShortcut(id, keys);
});

document.getElementById('kbBtn').onclick = () => { $kbOverlay.classList.add('open'); loadShortcuts(); };
document.getElementById('kbClose').onclick = () => { listeningId = null; $kbOverlay.classList.remove('open'); };
$kbOverlay.addEventListener('click', (e) => { if (e.target === $kbOverlay) { listeningId = null; $kbOverlay.classList.remove('open'); } });

load();
</script>
